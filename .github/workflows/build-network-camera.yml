name: Build ESP32-CAM network camera

on:
  workflow_dispatch:
  push:
    branches:
      - feature/network-camera-no-psram
      - integration/xiaozhi-mobile-robot-wakenet
  pull_request:
    branches:
      - ci/robot-eyes-corrected-v2

permissions:
  contents: read

jobs:
  build-camera:
    name: Build AI Thinker ESP32-CAM (PSRAM)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: Install Espressif Arduino core
        shell: bash
        run: |
          set -euxo pipefail
          arduino-cli config init
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core list

      - name: Compile AI Thinker ESP32-CAM firmware
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/network_camera" "$RUNNER_TEMP/camera-build"
          cp extras/network-camera-esp32cam/network_camera.ino "$RUNNER_TEMP/network_camera/network_camera.ino"
          arduino-cli compile --verbose \
            --fqbn esp32:esp32:esp32cam \
            --warnings all \
            --output-dir "$RUNNER_TEMP/camera-build" \
            "$RUNNER_TEMP/network_camera"
          echo "=== Build outputs ==="
          find "$RUNNER_TEMP/camera-build" -maxdepth 1 -type f -printf '%f %s bytes\n' | sort
          APP="$RUNNER_TEMP/camera-build/network_camera.ino.bin"
          BOOTLOADER="$RUNNER_TEMP/camera-build/network_camera.ino.bootloader.bin"
          PARTITIONS="$RUNNER_TEMP/camera-build/network_camera.ino.partitions.bin"
          test -s "$APP"
          test -s "$BOOTLOADER"
          test -s "$PARTITIONS"

          BOOT_APP0="$(find "$HOME/.arduino15/packages/esp32" -type f -name boot_app0.bin -print -quit)"
          ESPTOOL="$(find "$HOME/.arduino15/packages/esp32/tools/esptool_py" -type f \( -name esptool.py -o -name esptool \) -print -quit)"
          test -n "$BOOT_APP0" && test -s "$BOOT_APP0"
          test -n "$ESPTOOL" && test -s "$ESPTOOL"

          if [[ "$ESPTOOL" == *.py ]]; then
            python "$ESPTOOL" --chip esp32 merge_bin --flash_mode dio --flash_freq 40m --flash_size 4MB \
              -o "$RUNNER_TEMP/camera-build/xiaozhi-esp32cam-merged.bin" \
              0x1000 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0xe000 "$BOOT_APP0" 0x10000 "$APP"
          else
            "$ESPTOOL" --chip esp32 merge_bin --flash_mode dio --flash_freq 40m --flash_size 4MB \
              -o "$RUNNER_TEMP/camera-build/xiaozhi-esp32cam-merged.bin" \
              0x1000 "$BOOTLOADER" 0x8000 "$PARTITIONS" 0xe000 "$BOOT_APP0" 0x10000 "$APP"
          fi
          test -s "$RUNNER_TEMP/camera-build/xiaozhi-esp32cam-merged.bin"
          printf '%s\n' \
            'Board: AI Thinker ESP32-CAM' \
            'Target: ESP32, 4 MB flash, PSRAM enabled, DIO, 40 MHz' \
            'File: xiaozhi-esp32cam-merged.bin' \
            'Flash address: 0x00000000 (merged image)' \
            'This is a separate camera-node firmware, not the main XiaoZhi ESP32 firmware.' \
            > "$RUNNER_TEMP/camera-build/FLASH-INFO.txt"

      - name: Upload camera firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-esp32cam-network-camera
          path: |
            ${{ runner.temp }}/camera-build/xiaozhi-esp32cam-merged.bin
            ${{ runner.temp }}/camera-build/FLASH-INFO.txt
          if-no-files-found: error
